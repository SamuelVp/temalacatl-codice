<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Temalácatl Códice
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #07140f;

      color:
        #222;

    }


    .contenedor {

      max-width: 700px;

      margin: auto;

      background:
        #eee5d2;

      min-height:
        100vh;

    }



    /* ================================
       ENCABEZADO
    ================================= */


    .encabezado {

      background:
        #06291d;

      color:
        white;

      text-align:
        center;

      padding:
        28px 20px 30px;

      border-bottom:
        4px solid #c99b37;

    }


    .codigo {

      color:
        #d8ad4d;

      font-size:
        13px;

      letter-spacing:
        2px;

      text-transform:
        uppercase;

    }


    .encabezado h1 {

      margin:
        10px 0 4px;

      font-family:
        Georgia,
        serif;

      font-size:
        38px;

      color:
        #f4e5bd;

    }


    .subtitulo {

      margin: 0;

      font-size:
        19px;

      font-style:
        italic;

      color:
        #d8ad4d;

    }



    /* ================================
       VIDEO
    ================================= */


    .hero {

      width:
        100%;

      background:
        black;

    }


    .video-principal {

      width:
        100%;

      display:
        block;

      height:
        auto;

      background:
        black;

    }


    .video-proximamente {

      min-height:
        280px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      background:
        #061c13;

      color:
        #f4e5bd;

      padding:
        30px;

    }


    .video-proximamente span {

      font-size:
        50px;

      margin-bottom:
        15px;

    }



    /* ================================
       SONIDO
    ================================= */


    .controles-sonido {

      background:
        #09281c;

      text-align:
        center;

      padding:
        11px;

      border-bottom:
        1px solid #315242;

    }


    .boton-sonido {

      border:
        1px solid #d6aa4b;

      background:
        #123c2b;

      color:
        #f4e5bd;

      padding:
        10px 22px;

      border-radius:
        25px;

      font-size:
        15px;

      cursor:
        pointer;

    }


    .boton-sonido:hover {

      background:
        #19543b;

    }



    /* ================================
       PESTAÑAS
    ================================= */


    .tabs {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      background:
        #061c13;

      border-bottom:
        4px solid #c99b37;

    }


    .tab-button {

      border:
        none;

      padding:
        17px 10px;

      font-size:
        16px;

      font-weight:
        bold;

      cursor:
        pointer;

      background:
        #0b2e20;

      color:
        #c9b98c;

      transition:
        0.2s;

    }


    .tab-button:first-child {

      border-right:
        1px solid #315242;

    }


    .tab-button:hover {

      background:
        #123c2b;

    }


    .tab-button.active {

      background:
        #eee5d2;

      color:
        #123c2b;

      box-shadow:
        inset 0 -4px 0 #b88b32;

    }



    /* ================================
       CONTENIDO
    ================================= */


    .contenido {

      padding:
        18px;

    }


    .tab-content {

      display:
        none;

    }


    .tab-content.active {

      display:
        block;

    }



    /* ================================
       TARJETAS
    ================================= */


    .tarjeta {

      background:
        #fffaf0;

      border-radius:
        14px;

      padding:
        20px;

      margin-bottom:
        15px;

      border-left:
        5px solid #b88b32;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.10);

    }


    .tarjeta h2 {

      margin-top:
        0;

      color:
        #123c2b;

      font-size:
        21px;

    }


    .tarjeta h3 {

      color:
        #123c2b;

    }


    .tarjeta p {

      line-height:
        1.65;

      margin-bottom:
        0;

    }



    /* ================================
       DATOS CULTURALES
    ================================= */


    .datos {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      margin-top:
        14px;

    }


    .dato {

      background:
        #f2e7ce;

      padding:
        14px;

      border-radius:
        10px;

      text-align:
        center;

    }


    .dato strong {

      display:
        block;

      color:
        #123c2b;

      margin-bottom:
        5px;

    }



    /* ================================
       PESTAÑA TEMALÁCATL
    ================================= */


    .temalacatl {

      background:
        #0b2e20;

      color:
        white;

      border-left:
        5px solid #d6aa4b;

    }


    .temalacatl h2,
    .temalacatl h3 {

      color:
        #f3d993;

    }


    .temalacatl .dato {

      background:
        #f4ead4;

      color:
        #222;

    }


    .bloque-juego {

      margin-top:
        18px;

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid
        rgba(214,170,75,0.5);

      border-radius:
        12px;

      padding:
        18px;

    }


    .bloque-juego h3 {

      margin-top:
        0;

    }


    .bloque-juego p {

      margin-bottom:
        0;

      line-height:
        1.65;

    }



    /* ================================
       FUENTES
    ================================= */


    .fuentes ul {

      padding-left:
        20px;

    }


    .fuentes li {

      margin-bottom:
        15px;

      line-height:
        1.5;

    }


    .fuentes a {

      color:
        #0b5c42;

      font-weight:
        bold;

      text-decoration:
        none;

    }


    .fuentes a:hover {

      text-decoration:
        underline;

    }



    /* ================================
       ERROR
    ================================= */


    .error {

      padding:
        50px 20px;

      text-align:
        center;

      color:
        white;

    }



    /* ================================
       PIE
    ================================= */


    footer {

      background:
        #061c13;

      color:
        #d8ad4d;

      text-align:
        center;

      padding:
        25px 15px;

      border-top:
        3px solid #c99b37;

    }


    footer strong {

      font-family:
        Georgia,
        serif;

      font-size:
        22px;

    }


    footer p {

      margin-bottom:
        0;

    }



    /* ================================
       CELULAR
    ================================= */


    @media
    (max-width: 500px) {


      .encabezado h1 {

        font-size:
          31px;

      }


      .contenido {

        padding:
          12px;

      }


      .tarjeta {

        padding:
          17px;

      }


      .tab-button {

        font-size:
          14px;

        padding:
          15px 5px;

      }


    }

  </style>

</head>



<body>


<main
  class="contenedor"
  id="pagina"
>


  <!-- ===============================
       ENCABEZADO
  ================================= -->


  <header
    class="encabezado"
  >


    <div
      class="codigo"
      id="codigo"
    >
    </div>


    <h1
      id="nombre"
    >

      Cargando...

    </h1>


    <p
      class="subtitulo"
      id="subtitulo"
    >
    </p>


  </header>



  <!-- ===============================
       VIDEO
  ================================= -->


  <section
    class="hero"
  >


    <div
      id="media-container"
    >
    </div>


    <div
      class="controles-sonido"
      id="controles-sonido"
      style="display:none;"
    >


      <button
        class="boton-sonido"
        id="boton-sonido"
      >

        🔊 Activar sonido

      </button>


    </div>


  </section>



  <!-- ===============================
       PESTAÑAS
  ================================= -->


  <nav
    class="tabs"
  >


    <button
      class="tab-button active"
      id="btn-cultural"
      onclick="abrirPestana('cultural')"
    >

      🏺 Datos culturales

    </button>


    <button
      class="tab-button"
      id="btn-temalacatl"
      onclick="abrirPestana('temalacatl')"
    >

      ⚔️ Temalácatl

    </button>


  </nav>



  <!-- ===============================
       DATOS CULTURALES
  ================================= -->


  <section
    class="contenido tab-content active"
    id="tab-cultural"
  >


    <div
      id="secciones-culturales"
    >
    </div>



    <article
      class="tarjeta"
    >


      <h2>

        📌 Datos culturales generales

      </h2>


      <div
        class="datos"
        id="datos-generales"
      >
      </div>


    </article>



    <article
      class="tarjeta fuentes"
    >


      <h2>

        📚 Fuentes y referencias

      </h2>


      <div
        id="contenedor-fuentes"
      >
      </div>


    </article>


  </section>



  <!-- ===============================
       TEMALÁCATL
  ================================= -->


  <section
    class="contenido tab-content"
    id="tab-temalacatl"
  >


    <article
      class="tarjeta temalacatl"
    >


      <h2>

        ⚔️ Información de la carta

      </h2>


      <div
        class="datos"
        id="datos-temalacatl"
      >
      </div>



      <div
        id="descripcion-juego"
      >
      </div>



      <div
        id="efecto-juego"
      >
      </div>



      <div
        id="interpretacion-juego"
      >
      </div>


    </article>


  </section>



  <!-- ===============================
       PIE
  ================================= -->


  <footer>


    <strong>

      Temalácatl Códice

    </strong>


    <p>

      Conoce México
      a través de sus cartas

    </p>


  </footer>


</main>



<script>


/*
========================================
CAMBIAR PESTAÑA
========================================
*/


function abrirPestana(
  pestana
) {


  const cultural =
    document.getElementById(
      "tab-cultural"
    );


  const temalacatl =
    document.getElementById(
      "tab-temalacatl"
    );


  const btnCultural =
    document.getElementById(
      "btn-cultural"
    );


  const btnTemalacatl =
    document.getElementById(
      "btn-temalacatl"
    );



  cultural.classList.remove(
    "active"
  );


  temalacatl.classList.remove(
    "active"
  );


  btnCultural.classList.remove(
    "active"
  );


  btnTemalacatl.classList.remove(
    "active"
  );



  if (
    pestana ===
    "temalacatl"
  ) {


    temalacatl.classList.add(
      "active"
    );


    btnTemalacatl.classList.add(
      "active"
    );


  } else {


    cultural.classList.add(
      "active"
    );


    btnCultural.classList.add(
      "active"
    );


  }


}



/*
========================================
CARGAR CARTA
========================================
*/


async function cargarCarta() {


  try {


    /*
    LEER ID
    */


    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const id =
      parametros.get(
        "id"
      );



    if (
      !id
    ) {


      document.getElementById(
        "pagina"
      ).innerHTML = `


        <div class="error">


          <h1>

            Temalácatl Códice

          </h1>


          <p>

            Escanea el código QR
            de una carta para consultar
            su información.

          </p>


        </div>


      `;


      return;


    }



    /*
    CARGAR CARDS.JSON
    */


    const respuesta =
      await fetch(

        "cards.json?v=" +
        Date.now()

      );



    if (
      !respuesta.ok
    ) {


      throw new Error(

        "No se pudo cargar cards.json"

      );


    }



    const baseDatos =
      await respuesta.json();



    /*
    BUSCAR CARTA
    */


    const carta =
      baseDatos[id];



    if (
      !carta
    ) {


      document.getElementById(
        "pagina"
      ).innerHTML = `


        <div class="error">


          <h1>

            Carta no encontrada

          </h1>


          <p>

            No existe una carta
            registrada con el código

            <strong>

              ${id}

            </strong>.

          </p>


        </div>


      `;


      return;


    }



    /*
    ========================================
    ENCABEZADO
    ========================================
    */


    document.title =

      carta.nombre +
      " | Temalácatl Códice";



    document.getElementById(
      "codigo"
    ).textContent =

      `TEMALÁCATL CÓDICE · ${carta.codigo}`;



    document.getElementById(
      "nombre"
    ).textContent =

      carta.nombre;



    const subtitulo =
      document.getElementById(
        "subtitulo"
      );



    if (
      carta.subtitulo
    ) {


      subtitulo.textContent =
        carta.subtitulo;


      subtitulo.style.display =
        "block";


    } else {


      subtitulo.style.display =
        "none";


    }



    /*
    ========================================
    VIDEO
    ========================================
    */


    const mediaContainer =
      document.getElementById(
        "media-container"
      );


    const controlesSonido =
      document.getElementById(
        "controles-sonido"
      );


    const rutaVideo =
      carta.multimedia?.video;



    if (
      rutaVideo
    ) {


      mediaContainer.innerHTML = `


        <video

          id="video-principal"

          class="video-principal"

          autoplay

          muted

          loop

          playsinline

          preload="auto"

          controls

        >


          <source

            src="${rutaVideo}"

            type="video/mp4"

          >


          Tu navegador
          no puede reproducir
          este video.


        </video>


      `;



      controlesSonido.style.display =
        "block";



      const video =
        document.getElementById(
          "video-principal"
        );



      video.muted =
        true;



      const intento =
        video.play();



      if (
        intento !== undefined
      ) {


        intento.catch(
          () => {}
        );


      }



      const botonSonido =
        document.getElementById(
          "boton-sonido"
        );



      botonSonido.onclick =
        function() {


          if (
            video.muted
          ) {


            video.muted =
              false;


            video.volume =
              1;


            video.play();


            botonSonido.textContent =
              "🔊 Sonido activado";


          } else {


            video.muted =
              true;


            botonSonido.textContent =
              "🔇 Activar sonido";


          }


        };


    } else {


      controlesSonido.style.display =
        "none";



      mediaContainer.innerHTML = `


        <div
          class="video-proximamente"
        >


          <span>

            🎬

          </span>


          <strong>

            Video próximamente

          </strong>


        </div>


      `;


    }



    /*
    ========================================
    DIVIDIR CULTURA Y JUEGO
    ========================================
    */


    const culturales =
      [];


    const juegoExtra =
      [];



    if (
      carta.secciones
    ) {


      carta.secciones.forEach(
        seccion => {


          const titulo =

            (
              seccion.titulo ||
              ""
            )
            .toLowerCase();



          /*
          Las secciones relacionadas
          con el juego NO aparecen
          en información cultural.
          */


          if (

            titulo.includes(
              "temalácatl"
            )

            ||

            titulo.includes(
              "ficción"
            )

            ||

            titulo.includes(
              "ficticio"
            )

            ||

            titulo.includes(
              "representación"
            )

            ||

            titulo.includes(
              "interpretación"
            )

          ) {


            juegoExtra.push(
              seccion
            );


          } else {


            culturales.push(
              seccion
            );


          }


        }
      );


    }



    /*
    ========================================
    SECCIONES CULTURALES
    ========================================
    */


    const contenedorCultural =
      document.getElementById(
        "secciones-culturales"
      );


    contenedorCultural.innerHTML =
      "";



    culturales.forEach(
      seccion => {


        const bloque =
          document.createElement(
            "article"
          );


        bloque.className =
          "tarjeta";



        bloque.innerHTML = `


          <h2>

            ${seccion.icono || "🏺"}

            ${seccion.titulo}

          </h2>


          <p>

            ${seccion.contenido}

          </p>


        `;



        contenedorCultural.appendChild(
          bloque
        );


      }
    );



    /*
    ========================================
    DATOS CULTURALES GENERALES
    ========================================
    */


    const datosGenerales =
      document.getElementById(
        "datos-generales"
      );


    datosGenerales.innerHTML =
      "";



    if (
      carta.datos_generales
    ) {


      carta.datos_generales.forEach(
        dato => {


          const bloque =
            document.createElement(
              "div"
            );


          bloque.className =
            "dato";



          bloque.innerHTML = `


            <strong>

              ${dato.nombre}

            </strong>


            ${dato.valor}


          `;



          datosGenerales.appendChild(
            bloque
          );


        }
      );


    }



    /*
    ========================================
    FUENTES
    ========================================
    */


    const contenedorFuentes =
      document.getElementById(
        "contenedor-fuentes"
      );



    contenedorFuentes.innerHTML =
      "";



    if (

      carta.fuentes

      &&

      carta.fuentes.length > 0

    ) {


      const lista =
        document.createElement(
          "ul"
        );



      carta.fuentes.forEach(
        fuente => {


          const elemento =
            document.createElement(
              "li"
            );



          let contenido = `


            <strong>

              ${fuente.institucion || ""}

            </strong>


          `;



          if (
            fuente.titulo
          ) {


            contenido += `

              — ${fuente.titulo}

            `;


          }



          if (
            fuente.url
          ) {


            contenido += `


              <br>


              <a

                href="${fuente.url}"

                target="_blank"

                rel="noopener noreferrer"

              >

                Consultar fuente

              </a>


            `;


          }



          elemento.innerHTML =
            contenido;



          lista.appendChild(
            elemento
          );


        }
      );



      contenedorFuentes.appendChild(
        lista
      );


    } else {


      contenedorFuentes.innerHTML = `


        <p>

          Fuentes pendientes
          de integración.

        </p>


      `;


    }



    /*
    ========================================
    INFORMACIÓN TEMALÁCATL
    ========================================
    */


    const t =
      carta.temalacatl || {};



    const atk =

      t.atk === null

      ||

      t.atk === undefined

      ?

      "—"

      :

      t.atk;



    const def =

      t.def === null

      ||

      t.def === undefined

      ?

      "—"

      :

      t.def;



    document.getElementById(
      "datos-temalacatl"
    ).innerHTML = `


      <div class="dato">

        <strong>

          Categoría

        </strong>

        ${t.categoria || "—"}

      </div>



      <div class="dato">

        <strong>

          Terreno

        </strong>

        ${t.terreno || t.tipo || "—"}

      </div>



      <div class="dato">

        <strong>

          Rareza

        </strong>

        ${t.rareza || "—"}

      </div>



      <div class="dato">

        <strong>

          ATK

        </strong>

        ${atk}

      </div>



      <div class="dato">

        <strong>

          DEF

        </strong>

        ${def}

      </div>


    `;



    /*
    DESCRIPCIÓN
    */


    const descripcion =
      document.getElementById(
        "descripcion-juego"
      );



    if (
      t.descripcion
    ) {


      descripcion.innerHTML = `


        <div
          class="bloque-juego"
        >


          <h3>

            📜 Descripción

          </h3>


          <p>

            ${t.descripcion}

          </p>


        </div>


      `;


    } else {


      descripcion.innerHTML =
        "";


    }



    /*
    EFECTO
    */


    const efecto =
      document.getElementById(
        "efecto-juego"
      );



    if (
      t.efecto
    ) {


      efecto.innerHTML = `


        <div
          class="bloque-juego"
        >


          <h3>

            ✨ Efecto / Habilidad

          </h3>


          <p>

            ${t.efecto}

          </p>


        </div>


      `;


    } else {


      efecto.innerHTML =
        "";


    }



    /*
    SECCIONES QUE PERTENECEN AL JUEGO
    */


    const interpretacion =
      document.getElementById(
        "interpretacion-juego"
      );


    interpretacion.innerHTML =
      "";



    juegoExtra.forEach(
      seccion => {


        const bloque =
          document.createElement(
            "div"
          );


        bloque.className =
          "bloque-juego";



        bloque.innerHTML = `


          <h3>

            ${seccion.icono || "🎴"}

            ${seccion.titulo}

          </h3>


          <p>

            ${seccion.contenido}

          </p>


        `;



        interpretacion.appendChild(
          bloque
        );


      }
    );


  }


  catch (
    error
  ) {


    console.error(
      error
    );



    document.getElementById(
      "pagina"
    ).innerHTML = `


      <div class="error">


        <h1>

          Error al cargar
          el Códice

        </h1>


        <p>

          No fue posible cargar
          la información de esta carta.

        </p>


      </div>


    `;


  }


}



/*
INICIAR
*/


cargarCarta();


</script>


</body>

</html>
