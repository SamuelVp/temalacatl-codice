<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Temalácatl Códice</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07140f;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      background: #eee5d2;
      min-height: 100vh;
    }

    .encabezado {
      background: #06291d;
      color: white;
      text-align: center;
      padding: 28px 20px 30px;
      border-bottom: 4px solid #c99b37;
    }

    .codigo {
      color: #d8ad4d;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .encabezado h1 {
      margin: 10px 0 4px;
      font-family: Georgia, serif;
      font-size: 38px;
      color: #f4e5bd;
    }

    .cientifico {
      margin: 0;
      font-size: 20px;
      font-style: italic;
      color: #d8ad4d;
    }

    .hero {
      width: 100%;
      background: #153c29;
      overflow: hidden;
      border-bottom: 4px solid #c99b37;
    }

    .imagen-principal {
      width: 100%;
      height: auto;
      display: block;
    }

    .contenido {
      padding: 18px;
    }

    .tarjeta {
      background: #fffaf0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 5px solid #b88b32;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }

    .tarjeta h2 {
      margin-top: 0;
      color: #123c2b;
      font-size: 21px;
    }

    .tarjeta p {
      line-height: 1.65;
      margin-bottom: 0;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .dato {
      background: #f2e7ce;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .dato strong {
      display: block;
      color: #123c2b;
      margin-bottom: 5px;
    }

    .temalacatl {
      background: #0b2e20;
      color: white;
      border-left: 5px solid #d6aa4b;
    }

    .temalacatl h2 {
      color: #f3d993;
    }

    .temalacatl .dato {
      background: #f4ead4;
      color: #222;
    }

    .fuentes ul {
      padding-left: 20px;
    }

    .fuentes li {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .fuentes a {
      color: #0b5c42;
    }

    .error {
      padding: 50px 20px;
      text-align: center;
      color: white;
    }

    footer {
      background: #061c13;
      color: #d8ad4d;
      text-align: center;
      padding: 25px 15px;
      border-top: 3px solid #c99b37;
    }

    footer strong {
      font-family: Georgia, serif;
      font-size: 22px;
    }

    footer p {
      margin-bottom: 0;
    }

    @media (max-width: 500px) {

      .encabezado h1 {
        font-size: 32px;
      }

      .cientifico {
        font-size: 18px;
      }

      .contenido {
        padding: 12px;
      }

      .tarjeta {
        padding: 17px;
      }

    }

  </style>
</head>


<body>

  <main class="contenedor" id="pagina">

    <header class="encabezado">

      <div class="codigo" id="codigo"></div>

      <h1 id="nombre">
        Cargando...
      </h1>

      <p class="cientifico" id="subtitulo"></p>

    </header>


    <section class="hero" id="hero">

      <img
        id="imagen"
        class="imagen-principal"
        alt=""
      >

    </section>


    <section class="contenido">


      <div id="secciones"></div>


      <article class="tarjeta">

        <h2>
          📌 Datos generales
        </h2>

        <div
          class="datos"
          id="datos-generales">
        </div>

      </article>


      <article class="tarjeta temalacatl">

        <h2>
          ⚔️ En Temalácatl
        </h2>

        <div
          class="datos"
          id="datos-temalacatl">
        </div>

        <p id="lore"></p>

      </article>


      <article class="tarjeta fuentes">

        <h2>
          📚 Fuentes
        </h2>

        <ul id="fuentes"></ul>

      </article>


    </section>


    <footer>

      <strong>
        Temalácatl Códice
      </strong>

      <p>
        Conoce México a través de sus cartas
      </p>

    </footer>

  </main>


  <script>

    async function cargarCarta() {

      try {

        /*
        Lee el ID que venga en la dirección.

        Ejemplo:
        ?id=ENM-047

        Mientras estamos haciendo pruebas,
        si no existe ID abrirá Jaguar.
        */

        const parametros =
          new URLSearchParams(window.location.search);

        const id =
          parametros.get("id") || "ENM-047";


        /*
        Cargar base de datos
        */

        const respuesta =
          await fetch("cards.json");

        if (!respuesta.ok) {
          throw new Error("No se pudo cargar cards.json");
        }

        const baseDatos =
          await respuesta.json();


        /*
        Buscar carta
        */

        const carta =
          baseDatos[id];


        if (!carta) {

          document.getElementById("pagina").innerHTML = `
            <div class="error">
              <h1>Carta no encontrada</h1>
              <p>
                No existe una carta registrada con el código
                <strong>${id}</strong>.
              </p>
            </div>
          `;

          return;
        }


        /*
        Título del navegador
        */

        document.title =
          carta.nombre + " | Temalácatl Códice";


        /*
        Encabezado
        */

        document.getElementById("codigo")
          .textContent =
          `TEMALÁCATL CÓDICE · ${carta.codigo}`;

        document.getElementById("nombre")
          .textContent =
          carta.nombre;

        document.getElementById("subtitulo")
          .textContent =
          carta.subtitulo || "";


        /*
        Imagen
        */

        const imagen =
          document.getElementById("imagen");

        imagen.src =
          carta.multimedia.imagen;

        imagen.alt =
          carta.nombre;


        /*
        Secciones culturales
        */

        const contenedorSecciones =
          document.getElementById("secciones");


        carta.secciones.forEach(seccion => {

          const bloque =
            document.createElement("article");

          bloque.className =
            "tarjeta";

          bloque.innerHTML = `
            <h2>
              ${seccion.icono || ""}
              ${seccion.titulo}
            </h2>

            <p>
              ${seccion.contenido}
            </p>
          `;

          contenedorSecciones.appendChild(bloque);

        });


        /*
        Datos generales
        */

        const datosGenerales =
          document.getElementById("datos-generales");


        carta.datos_generales.forEach(dato => {

          const bloque =
            document.createElement("div");

          bloque.className =
            "dato";

          bloque.innerHTML = `
            <strong>
              ${dato.nombre}
            </strong>

            ${dato.valor}
          `;

          datosGenerales.appendChild(bloque);

        });


        /*
        Información del TCG
        */

        const t =
          carta.temalacatl;

        const atk =
          t.atk === null
          ? "—"
          : t.atk;

        const def =
          t.def === null
          ? "—"
          : t.def;


        document.getElementById(
          "datos-temalacatl"
        ).innerHTML = `

          <div class="dato">
            <strong>Tipo</strong>
            ${t.tipo || "—"}
          </div>

          <div class="dato">
            <strong>Rareza</strong>
            ${t.rareza || "—"}
          </div>

          <div class="dato">
            <strong>ATK</strong>
            ${atk}
          </div>

          <div class="dato">
            <strong>DEF</strong>
            ${def}
          </div>

        `;


        /*
        Lore
        */

        const lore =
          document.getElementById("lore");

        if (t.lore) {

          lore.innerHTML = `
            <br>
            <strong>Lore de Temalácatl</strong><br><br>
            ${t.lore}
          `;

        } else {

          lore.style.display =
            "none";

        }


        /*
        Fuentes
        */

        const listaFuentes =
          document.getElementById("fuentes");


        carta.fuentes.forEach(fuente => {

          const elemento =
            document.createElement("li");


          if (fuente.url) {

            elemento.innerHTML = `
              <strong>
                ${fuente.institucion}
              </strong>

              ${fuente.titulo
                ? " — " + fuente.titulo
                : ""
              }

              <br>

              <a
                href="${fuente.url}"
                target="_blank"
                rel="noopener noreferrer">
                Consultar fuente
              </a>
            `;

          } else {

            elemento.innerHTML = `
              <strong>
                ${fuente.institucion}
              </strong>

              ${fuente.titulo
                ? " — " + fuente.titulo
                : ""
              }
            `;

          }


          listaFuentes.appendChild(
            elemento
          );

        });


      } catch (error) {

        console.error(error);

        document.getElementById("pagina")
          .innerHTML = `

          <div class="error">

            <h1>
              Error al cargar el Códice
            </h1>

            <p>
              No fue posible cargar la información
              de esta carta.
            </p>

          </div>

        `;

      }

    }


    cargarCarta();

  </script>

</body>

</html>
