<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temalácatl Códice</title>

  <style>
    :root{
      --oro:#d6aa4b;
      --oro-claro:#f0d47c;
      --oro-oscuro:#7a5517;
      --obsidiana:#090b0a;
      --obsidiana-2:#111612;
      --verde:#063323;
      --verde-2:#0b4a35;
      --turquesa:#1f8e8a;
      --turquesa-oscuro:#0e5755;
      --pergamino:#efe1bd;
      --pergamino-2:#d8c38f;
      --tinta:#2f2514;
      --rojo:#9d2d1e;
      --borde:#5f4316;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--tinta);
      background:
        radial-gradient(circle at 20% 15%,rgba(35,120,105,.15),transparent 28%),
        radial-gradient(circle at 80% 10%,rgba(212,170,75,.12),transparent 30%),
        linear-gradient(180deg,#040706,#09130e 55%,#050807);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.16;
      background-image:
        linear-gradient(45deg,transparent 47%,rgba(214,170,75,.18) 48%,rgba(214,170,75,.18) 52%,transparent 53%);
      background-size:42px 42px;
    }

    button{font:inherit}

    .codice{
      width:min(760px,100%);
      min-height:100vh;
      margin:auto;
      position:relative;
      background:
        linear-gradient(rgba(8,12,10,.96),rgba(8,12,10,.96)),
        radial-gradient(circle at center,#24301f,#090b0a);
      border-left:3px solid #8c681e;
      border-right:3px solid #8c681e;
      box-shadow:0 0 50px rgba(0,0,0,.55);
      overflow:hidden;
    }

    .codice::before,
    .codice::after{
      content:"";
      position:absolute;
      left:9px;
      right:9px;
      height:5px;
      z-index:10;
      background:linear-gradient(90deg,
        #50330d 0%,#f2d979 12%,#8a611a 22%,#d9ad45 50%,
        #8a611a 78%,#f2d979 88%,#50330d 100%);
    }

    .codice::before{top:8px}
    .codice::after{bottom:8px}

    /* ======================================================
       CABECERA ESTILO CARTA
       ====================================================== */

    .cabecera{
      position:relative;
      padding:34px 22px 26px;
      text-align:center;
      background:
        linear-gradient(180deg,rgba(1,12,8,.96),rgba(3,36,25,.97)),
        radial-gradient(circle at 50% 0%,rgba(31,142,138,.25),transparent 50%);
      border-bottom:4px solid var(--oro);
      overflow:hidden;
    }

    .cabecera::before,
    .cabecera::after{
      content:"";
      position:absolute;
      top:18px;
      width:78px;
      height:78px;
      border:3px solid var(--oro);
      opacity:.55;
      transform:rotate(45deg);
    }

    .cabecera::before{left:-40px}
    .cabecera::after{right:-40px}

    .marca-codice{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
      padding:6px 13px;
      border:1px solid rgba(240,212,124,.7);
      border-radius:999px;
      color:var(--oro-claro);
      background:rgba(0,0,0,.28);
      font-size:11px;
      font-weight:800;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    .marca-codice::before,
    .marca-codice::after{
      content:"◆";
      color:var(--turquesa);
      font-size:8px;
    }

    .cabecera h1{
      margin:5px 0 5px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(34px,7vw,52px);
      line-height:1.02;
      letter-spacing:.5px;
      color:#f5dc87;
      text-shadow:
        0 2px 0 #6b460d,
        0 5px 15px rgba(0,0,0,.72);
    }

    .subtitulo{
      margin:0;
      color:#9fddd5;
      font-family:Georgia,serif;
      font-size:clamp(17px,3.8vw,22px);
      font-style:italic;
    }

    .ornamento-titulo{
      width:170px;
      height:12px;
      margin:14px auto 0;
      position:relative;
      border-top:2px solid var(--oro);
    }

    .ornamento-titulo::before{
      content:"";
      position:absolute;
      width:18px;
      height:18px;
      left:50%;
      top:-10px;
      transform:translateX(-50%) rotate(45deg);
      background:var(--verde);
      border:2px solid var(--oro);
      box-shadow:0 0 0 3px rgba(31,142,138,.35);
    }

    /* ======================================================
       VIDEO / ILUSTRACIÓN VIVA
       ====================================================== */

    .marco-video{
      position:relative;
      margin:14px 14px 0;
      padding:9px;
      background:
        linear-gradient(135deg,#5d3c0b,#e1b64b 15%,#7a5313 35%,#f0d77b 50%,#6c4610 68%,#d5aa42 86%,#50320a);
      border:2px solid #2d1b06;
      box-shadow:
        inset 0 0 0 2px #f1d876,
        0 10px 28px rgba(0,0,0,.55);
      clip-path:polygon(17px 0,calc(100% - 17px) 0,100% 17px,100% calc(100% - 17px),calc(100% - 17px) 100%,17px 100%,0 calc(100% - 17px),0 17px);
    }

    .marco-video::before{
      content:"";
      position:absolute;
      inset:7px;
      pointer-events:none;
      z-index:3;
      border:2px solid var(--turquesa);
      opacity:.65;
      clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
    }

    .media{
      position:relative;
      background:#000;
      overflow:hidden;
      min-height:200px;
    }

    .video-principal{
      width:100%;
      height:auto;
      display:block;
      background:#000;
    }

    .video-proximamente{
      min-height:330px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      color:var(--oro-claro);
      text-align:center;
      background:
        radial-gradient(circle at center,rgba(31,142,138,.22),transparent 40%),
        linear-gradient(160deg,#071b14,#030706);
    }

    .video-proximamente .simbolo{
      width:86px;
      height:86px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:4px double var(--oro);
      color:var(--oro);
      font-size:40px;
      background:#0a2017;
      box-shadow:0 0 0 6px rgba(31,142,138,.18);
    }

    .controles-sonido{
      margin:0 14px;
      padding:10px;
      display:flex;
      justify-content:center;
      background:#071c14;
      border-left:2px solid var(--oro-oscuro);
      border-right:2px solid var(--oro-oscuro);
      border-bottom:2px solid var(--oro);
    }

    .boton-sonido{
      border:1px solid var(--oro);
      color:#f5dc87;
      background:linear-gradient(#164b38,#09291e);
      padding:9px 18px;
      border-radius:3px;
      font-weight:800;
      letter-spacing:.4px;
      cursor:pointer;
      box-shadow:inset 0 0 0 1px rgba(240,212,124,.15);
    }

    /* ======================================================
       PESTAÑAS COMO PLACAS
       ====================================================== */

    .tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:16px 14px 12px;
      background:#080c0a;
    }

    .tab-button{
      position:relative;
      min-height:58px;
      border:2px solid #6b4b12;
      color:#c7b67f;
      background:
        linear-gradient(180deg,#171a16,#080b09);
      font-family:Georgia,serif;
      font-size:15px;
      font-weight:800;
      letter-spacing:.5px;
      cursor:pointer;
      clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
      transition:.18s ease;
    }

    .tab-button::before{
      content:"";
      position:absolute;
      inset:4px;
      border:1px solid rgba(31,142,138,.35);
      pointer-events:none;
    }

    .tab-button:hover{
      color:#f3d77d;
      border-color:#b98a25;
    }

    .tab-button.active{
      color:#161107;
      background:linear-gradient(180deg,#f2d77a,#b88422);
      border-color:#f7df8c;
      box-shadow:0 0 18px rgba(214,170,75,.22);
    }

    .tab-button.active::before{
      border-color:rgba(30,69,57,.5);
    }

    /* ======================================================
       CONTENIDO GENERAL
       ====================================================== */

    .contenido{
      display:none;
      padding:6px 14px 26px;
    }

    .contenido.active{display:block}

    .panel{
      position:relative;
      margin:14px 0;
      overflow:hidden;
    }

    .panel-cultural{
      padding:5px;
      background:linear-gradient(135deg,#624313,#d3a83d,#6d4b16,#e6c267,#664313);
      clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
      box-shadow:0 7px 19px rgba(0,0,0,.4);
    }

    .panel-cultural-interior{
      position:relative;
      padding:18px 18px 20px;
      min-height:120px;
      background:
        radial-gradient(circle at 5% 10%,rgba(114,76,16,.13),transparent 22%),
        radial-gradient(circle at 88% 86%,rgba(114,76,16,.10),transparent 24%),
        linear-gradient(180deg,#f2e6c7,#e4d1a3);
      border:1px solid #69501e;
    }

    .panel-cultural-interior::before{
      content:"";
      position:absolute;
      inset:7px;
      pointer-events:none;
      border:1px solid rgba(106,76,24,.22);
    }

    .titulo-panel{
      display:flex;
      align-items:center;
      gap:10px;
      margin:-3px 0 10px;
      color:#173b2d;
      font-family:Georgia,serif;
      font-size:21px;
      font-weight:800;
    }

    .titulo-panel .icono{
      flex:0 0 38px;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:#f3d675;
      background:
        radial-gradient(circle at 35% 30%,#4e8f7f,#0c3d30 56%,#061d16);
      border:2px solid #b98a25;
      box-shadow:0 0 0 2px rgba(107,70,13,.22);
      font-size:19px;
    }

    .texto-cultural{
      margin:0;
      position:relative;
      z-index:1;
      line-height:1.68;
      font-size:16px;
      color:#302514;
    }

    /* ======================================================
       MAPA EN MARCO
       ====================================================== */

    .mapa-panel{
      padding:5px;
      background:linear-gradient(135deg,#684512,#d3a23a,#6d4713,#ecd178,#684512);
      clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
    }

    .mapa-interior{
      background:#efe1bd;
      border:1px solid #6e521d;
      overflow:hidden;
    }

    .mapa-cabecera{
      padding:17px 18px 13px;
      background:linear-gradient(180deg,#192119,#0e120f);
      border-bottom:2px solid #a9781d;
      color:#f2dc96;
    }

    .mapa-cabecera h2{
      margin:0 0 5px;
      font-family:Georgia,serif;
      font-size:21px;
      color:#f2d678;
    }

    .mapa-cabecera p{
      margin:0;
      color:#ddd2aa;
      line-height:1.5;
    }

    .mapa-imagen-wrap{
      position:relative;
      width:100%;
      background:#dac693;
      overflow:hidden;
    }

    .mapa-base{
      width:100%;
      height:auto;
      display:block;
    }

    .mapa-marcador{
      position:absolute;
      transform:translate(-50%,-88%);
      z-index:4;
      cursor:pointer;
      user-select:none;
      filter:drop-shadow(0 2px 2px rgba(0,0,0,.55));
    }

    .mapa-marcador .bandera{
      display:block;
      font-size:clamp(20px,4.2vw,34px);
      line-height:1;
      animation:bandera 2.1s ease-in-out infinite;
    }

    .mapa-marcador.zona::before{
      content:"";
      position:absolute;
      left:50%;
      top:76%;
      width:clamp(30px,6.3vw,54px);
      height:clamp(30px,6.3vw,54px);
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:rgba(157,45,30,.14);
      border:2px dashed rgba(157,45,30,.85);
      z-index:-1;
    }

    .mapa-etiqueta{
      position:absolute;
      left:50%;
      top:100%;
      transform:translateX(-50%);
      margin-top:4px;
      padding:5px 7px;
      white-space:nowrap;
      border:1px solid #d0a84f;
      border-radius:3px;
      background:rgba(10,16,12,.93);
      color:#f8e3a0;
      font-size:11px;
      font-weight:800;
      opacity:0;
      pointer-events:none;
      transition:opacity .15s;
    }

    .mapa-marcador:hover .mapa-etiqueta,
    .mapa-marcador:focus .mapa-etiqueta{opacity:1}

    @keyframes bandera{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-2px)}
    }

    .mapa-leyenda{
      padding:13px 16px 16px;
      background:#e8d7aa;
      border-top:1px solid #9f7b2e;
    }

    .mapa-chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:9px;
    }

    .mapa-chip{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 9px;
      color:#38270d;
      background:#f4e7c4;
      border:1px solid #ba913b;
      font-size:12px;
      font-weight:700;
    }

    .mapa-chip::before{content:"🚩"}

    .mapa-nota{
      margin:0;
      color:#6b5834;
      font-size:12px;
      font-style:italic;
      line-height:1.45;
    }

    /* CAMBIO MAPA ↔ IMAGEN REAL */
    .visual-carrusel{
      position:relative;
      overflow:hidden;
      background:#0a0f0c;
    }

    .visual-vista{
      display:none;
    }

    .visual-vista.activa{
      display:block;
    }

    .visual-imagen-real{
      width:100%;
      max-height:560px;
      object-fit:contain;
      display:block;
      background:#030504;
    }

    .visual-flecha{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      z-index:50;
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:2px solid #e2bd59;
      background:rgba(5,12,9,.88);
      color:#f4da7b;
      font-size:34px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.55);
    }

    .visual-flecha:hover{
      background:#123c2d;
    }

    .visual-flecha.izq{left:14px}
    .visual-flecha.der{right:14px}

    .visual-indicadores{
      display:flex;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      background:#111813;
      border-top:1px solid #6f521a;
    }

    .visual-punto{
      width:10px;
      height:10px;
      border-radius:50%;
      border:1px solid #d0a03b;
      background:#4a3510;
    }

    .visual-punto.activo{
      background:#f0ce67;
      box-shadow:0 0 8px rgba(240,206,103,.6);
    }

    .visual-etiqueta{
      display:inline-block;
      margin-left:8px;
      padding:4px 8px;
      color:#102c22;
      background:#e9c965;
      border:1px solid #6e4c12;
      font-size:11px;
      font-weight:900;
      letter-spacing:.4px;
      text-transform:uppercase;
      vertical-align:middle;
    }

    @media(max-width:520px){
      .visual-flecha{
        width:40px;
        height:40px;
        font-size:23px;
      }
      .visual-flecha.izq{left:8px}
      .visual-flecha.der{right:8px}
    }

    .mapa-svg-wrap{
      background:#dac693;
      border-bottom:1px solid #8d6a27;
    }

    .mapa-svg{
      width:100%;
      height:auto;
      display:block;
    }

    /* ======================================================
       FUENTES
       ====================================================== */

    .fuentes-panel{
      padding:5px;
      background:linear-gradient(135deg,#654312,#d5a642,#6d4912,#dfbe61,#654312);
      clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
    }

    .fuentes-interior{
      padding:18px;
      background:linear-gradient(180deg,#111612,#07100b);
      border:1px solid #6d5019;
      color:#eadfbf;
    }

    .fuentes-interior h2{
      margin:0 0 12px;
      color:#efd475;
      font-family:Georgia,serif;
      font-size:21px;
    }

    .fuentes-interior ul{
      margin:0;
      padding-left:19px;
    }

    .fuentes-interior li{
      margin:0 0 14px;
      line-height:1.48;
      color:#ddd2af;
    }

    .fuentes-interior a{
      display:inline-block;
      margin-top:4px;
      color:#63c8bc;
      font-weight:800;
      text-decoration:none;
    }


    /* ======================================================
       IMAGEN REAL DE REFERENCIA
       ====================================================== */

    .galeria-panel{
      padding:5px;
      background:linear-gradient(135deg,#654312,#d5a642,#6d4912,#dfbe61,#654312);
      clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
    }

    .galeria-interior{
      background:linear-gradient(180deg,#121713,#07110d);
      border:1px solid #6d5019;
      color:#eadfbf;
      overflow:hidden;
    }

    .galeria-cabecera{
      padding:16px 18px 12px;
      border-bottom:2px solid #a9781d;
      background:linear-gradient(180deg,#10211a,#08120e);
    }

    .galeria-cabecera h2{
      margin:0 0 6px;
      color:#efd475;
      font-family:Georgia,serif;
      font-size:21px;
    }

    .galeria-cabecera p{
      margin:0;
      color:#ddd2aa;
      line-height:1.5;
    }

    .galeria-cuerpo{
      padding:15px;
    }

    .galeria-visor{
      padding:9px;
      background:linear-gradient(135deg,#53350a,#d3a644,#6d4912,#f0d67d,#53350a);
      clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    }

    .galeria-imagen{
      width:100%;
      display:block;
      max-height:520px;
      object-fit:contain;
      background:#050706;
      border:1px solid #5f4515;
    }

    .galeria-info{
      padding:13px 14px 14px;
      background:linear-gradient(180deg,#0d1712,#07100c);
      border-top:1px solid #78561b;
    }

    .galeria-info h3{
      margin:0 0 6px;
      color:#f0d97d;
      font-family:Georgia,serif;
      font-size:19px;
    }

    .galeria-info p{
      margin:0;
      color:#ded3b0;
      line-height:1.55;
    }

    /* ======================================================
       TEMALÁCATL — ESTILO DE CARTA
       ====================================================== */

    .panel-juego{
      margin:14px 0;
      padding:6px;
      background:
        linear-gradient(135deg,#4f3108,#f2d16d 13%,#765014 25%,#dba944 47%,#6c4810 70%,#f0d475 86%,#4d3008);
      clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
      box-shadow:0 9px 25px rgba(0,0,0,.55);
    }

    .juego-interior{
      padding:18px;
      background:
        linear-gradient(135deg,rgba(31,142,138,.09),transparent 24%),
        linear-gradient(180deg,#111512,#050706 58%,#101410);
      border:1px solid #3f2b0b;
      color:#eee5cb;
      position:relative;
      overflow:hidden;
    }

    .juego-interior::before,
    .juego-interior::after{
      content:"";
      position:absolute;
      width:85px;
      height:85px;
      border:2px solid rgba(31,142,138,.35);
      transform:rotate(45deg);
      pointer-events:none;
    }

    .juego-interior::before{top:-57px;left:-57px}
    .juego-interior::after{bottom:-57px;right:-57px}

    .placa-seccion{
      position:relative;
      margin:-3px auto 17px;
      width:min(430px,92%);
      padding:10px 16px;
      text-align:center;
      color:#0b0d0b;
      background:linear-gradient(180deg,#f3d879,#ad7720);
      border:2px solid #5b3b0b;
      font-family:Georgia,serif;
      font-weight:900;
      font-size:19px;
      letter-spacing:.7px;
      clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
      box-shadow:inset 0 0 0 1px rgba(255,237,160,.55);
    }

    .datos-carta{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .placa-dato{
      min-height:78px;
      padding:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:
        linear-gradient(180deg,rgba(239,217,154,.97),rgba(205,174,101,.97));
      border:2px solid #5c3d0c;
      outline:1px solid rgba(31,142,138,.4);
      outline-offset:-5px;
      color:#251a09;
      clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
    }

    .placa-dato strong{
      margin-bottom:5px;
      font-family:Georgia,serif;
      font-size:13px;
      letter-spacing:.5px;
      text-transform:uppercase;
      color:#123f32;
    }

    .placa-dato span{
      font-size:16px;
      font-weight:800;
    }

    .cabecera-combate{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
      margin:20px 0 14px;
    }

    .linea-ornamental{
      height:2px;
      background:linear-gradient(90deg,transparent,var(--oro),var(--turquesa));
    }

    .linea-ornamental:last-child{
      transform:scaleX(-1);
    }

    .sello-combate{
      width:64px;
      height:64px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:
        radial-gradient(circle,#1a5948 0 32%,#071c15 33% 54%,#b88522 55% 60%,#111 61%);
      border:3px solid #e3bd59;
      color:#f4d879;
      font-size:28px;
      box-shadow:
        0 0 0 4px #3b280b,
        0 0 0 6px rgba(31,142,138,.45);
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-bottom:16px;
    }

    .stat{
      min-height:128px;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%,#183e34 0 23%,#07120e 46%,#030504 63%,#9a6a1b 64% 68%,#251707 69% 74%,#d3a344 75% 78%,#070a08 79%);
      color:#f3db89;
      aspect-ratio:1.25/1;
      border:1px solid #563608;
      text-shadow:0 2px 5px #000;
    }

    .stat .label{
      font-size:clamp(18px,4vw,28px);
      letter-spacing:2.5px;
      color:#8be0d4;
      font-weight:900;
      text-shadow:0 2px 6px #000;
    }

    .stat .valor{
      margin-top:10px;
      font-family:Georgia,serif;
      font-size:clamp(46px,9vw,70px);
      font-weight:900;
      line-height:1;
    }

    .franja-rareza{
      display:flex;
      justify-content:center;
      margin:5px 0 17px;
    }

    .rareza{
      padding:8px 18px;
      border:2px solid #6c470e;
      background:linear-gradient(#e3bb53,#9d6717);
      color:#201405;
      font-family:Georgia,serif;
      font-size:14px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:1px;
      clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
    }

    .bloque-juego{
      margin-top:13px;
      position:relative;
      padding:17px 16px 18px;
      background:
        linear-gradient(180deg,#121513,#070908);
      border:2px solid #765316;
      box-shadow:inset 0 0 0 1px rgba(31,142,138,.28);
      color:#e8dfc5;
    }

    .bloque-juego::before{
      content:"";
      position:absolute;
      top:-2px;
      left:14px;
      right:14px;
      height:4px;
      background:linear-gradient(90deg,transparent,var(--turquesa),var(--oro),var(--turquesa),transparent);
    }

    .bloque-juego h3{
      margin:0 0 9px;
      font-family:Georgia,serif;
      color:#efd26e;
      font-size:18px;
    }

    .bloque-juego p{
      margin:0;
      line-height:1.63;
      color:#e7dfc9;
    }

    .efecto-destacado{
      border-color:#a8781f;
    }

    .efecto-destacado h3{
      color:#6ee0b7;
      text-shadow:0 1px 4px #000;
    }

    /* ======================================================
       ERROR Y FOOTER
       ====================================================== */

    .error{
      min-height:70vh;
      display:grid;
      place-items:center;
      text-align:center;
      padding:40px 20px;
      color:#f0d577;
    }

    .error > div{
      max-width:520px;
      padding:28px;
      border:2px solid #a3761c;
      background:#08130e;
    }

    footer{
      margin-top:8px;
      padding:25px 15px 31px;
      text-align:center;
      color:#bfa35f;
      background:#030604;
      border-top:2px solid #6d4c13;
    }

    footer strong{
      display:block;
      font-family:Georgia,serif;
      font-size:24px;
      color:#e3c45f;
      letter-spacing:1px;
    }

    footer p{
      margin:5px 0 0;
      font-size:13px;
      letter-spacing:.7px;
    }

    @media(max-width:520px){
      .codice{border-left-width:1px;border-right-width:1px}
      .cabecera{padding:30px 14px 22px}
      .marco-video{margin-left:7px;margin-right:7px}
      .controles-sonido{margin-left:7px;margin-right:7px}
      .tabs{padding-left:7px;padding-right:7px}
      .contenido{padding-left:7px;padding-right:7px}
      .tab-button{font-size:13px;min-height:54px}
      .panel-cultural-interior{padding:15px 14px 17px}
      .titulo-panel{font-size:19px}
      .titulo-panel .icono{width:34px;height:34px;flex-basis:34px}
      .texto-cultural{font-size:15px}
      .datos-carta{grid-template-columns:1fr 1fr}
      .placa-dato{min-height:72px}
      .juego-interior{padding:14px}
      .stats{gap:8px}
      .stat{min-height:108px}
    }
  </style>
</head>

<body>

<main class="codice" id="pagina">

  <header class="cabecera">
    <div class="marca-codice" id="codigo">TEMALÁCATL CÓDICE</div>
    <h1 id="nombre">Cargando...</h1>
    <p class="subtitulo" id="subtitulo"></p>
    <div class="ornamento-titulo"></div>
  </header>

  <section class="marco-video">
    <div class="media" id="media-container"></div>
  </section>

  <div class="controles-sonido" id="controles-sonido" style="display:none">
    <button class="boton-sonido" id="boton-sonido" type="button">🔊 Activar sonido</button>
  </div>

  <nav class="tabs" aria-label="Secciones del Códice">
    <button class="tab-button active" id="btn-cultural" type="button">
      🏺 DATOS CULTURALES
    </button>
    <button class="tab-button" id="btn-temalacatl" type="button">
      ⚔️ TEMALÁCATL
    </button>
  </nav>

  <!-- =====================================================
       PESTAÑA CULTURAL
       ===================================================== -->

  <section class="contenido active" id="tab-cultural">
    <div id="secciones-culturales"></div>

    <div id="mapa-contenedor"></div>


    <article class="panel fuentes-panel">
      <div class="fuentes-interior">
        <h2>📚 Fuentes del Códice</h2>
        <div id="contenedor-fuentes"></div>
      </div>
    </article>
  </section>

  <!-- =====================================================
       PESTAÑA TEMALÁCATL
       ===================================================== -->

  <section class="contenido" id="tab-temalacatl">

    <article class="panel-juego">
      <div class="juego-interior">

        <div class="placa-seccion">TEMALÁCATL · DATOS DE CARTA</div>

        <div class="datos-carta" id="datos-generales"></div>

        <div class="franja-rareza">
          <div class="rareza" id="rareza-juego">RAREZA</div>
        </div>

        <div class="cabecera-combate">
          <div class="linea-ornamental"></div>
          <div class="sello-combate">⚔</div>
          <div class="linea-ornamental"></div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">ATK</span>
            <span class="valor" id="atk-juego">—</span>
          </div>

          <div class="stat">
            <span class="label">DEF</span>
            <span class="valor" id="def-juego">—</span>
          </div>
        </div>

        <div id="tipo-juego"></div>
        <div id="descripcion-juego"></div>
        <div id="efecto-juego"></div>
        <div id="interpretacion-juego"></div>

      </div>
    </article>

  </section>

  <footer>
    <strong>TEMALÁCATL CÓDICE</strong>
    <p>Conoce México a través de sus cartas</p>
  </footer>

</main>

<script>
  /* ======================================================
     UTILIDADES
     ====================================================== */

  function escaparHTML(texto){
    return String(texto ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function cambiarPestana(destino){
    const cultural = document.getElementById("tab-cultural");
    const juego = document.getElementById("tab-temalacatl");
    const btnCultural = document.getElementById("btn-cultural");
    const btnJuego = document.getElementById("btn-temalacatl");

    cultural.classList.toggle("active", destino === "cultural");
    juego.classList.toggle("active", destino === "temalacatl");
    btnCultural.classList.toggle("active", destino === "cultural");
    btnJuego.classList.toggle("active", destino === "temalacatl");
  }

  document.getElementById("btn-cultural").addEventListener("click", () => cambiarPestana("cultural"));
  document.getElementById("btn-temalacatl").addEventListener("click", () => cambiarPestana("temalacatl"));

  /* ======================================================
     MAPA CON IMAGEN BASE + BANDERAS
     ====================================================== */

  function proyectarSobreImagen(lat,lon){
    const minLon=-118.5,maxLon=-86.5,minLat=14,maxLat=33;

    /*
      Estos porcentajes corresponden al encuadre de
      mapa_mexico_base.png. Si cambias esa imagen,
      aquí se puede recalibrar la posición de las banderas.
    */
    const left=4.5;
    const right=96.0;
    const top=10.0;
    const bottom=89.0;

    const nx=(lon-minLon)/(maxLon-minLon);
    const ny=(maxLat-lat)/(maxLat-minLat);

    return {
      x:left+(nx*(right-left)),
      y:top+(ny*(bottom-top))
    };
  }

  function mapaMexico(mapa){
    let marcas="";

    (mapa.puntos || []).forEach(pt => {
      const q=proyectarSobreImagen(pt.lat,pt.lon);
      const clase=pt.estilo==="zona" ? "mapa-marcador zona" : "mapa-marcador";
      const nombre=escaparHTML(pt.nombre);

      marcas += `
        <div
          class="${clase}"
          style="left:${q.x.toFixed(2)}%;top:${q.y.toFixed(2)}%;"
          tabindex="0"
          role="img"
          aria-label="${nombre}">
          <span class="bandera">🚩</span>
          <span class="mapa-etiqueta">${nombre}</span>
        </div>
      `;
    });

    return `
      <div class="mapa-imagen-wrap">
        <img
          class="mapa-base"
          src="mapa_mexico_base.png"
          alt="Mapa cultural ilustrado de México"
          loading="lazy">
        ${marcas}
      </div>
    `;
  }

  function mapaCosmologico(mapa){
    const ambito=mapa.ambito || "";
    const activos={
      cielo_superior:110,
      cielo:215,
      paraiso_lluvia:215,
      lugar_primordial:320,
      inframundo:425
    };

    const y=activos[ambito] || 320;
    const activo = tipo => ambito===tipo || (tipo==="cielo" && ambito==="paraiso_lluvia");

    return `
      <div class="mapa-svg-wrap">
        <svg class="mapa-svg" viewBox="0 0 900 520"
             role="img"
             aria-label="${escaparHTML(mapa.titulo)}">

          <defs>
            <linearGradient id="fondoCosmo" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#efe2bd"/>
              <stop offset="1" stop-color="#cdb474"/>
            </linearGradient>
          </defs>

          <rect width="900" height="520" fill="url(#fondoCosmo)"/>

          <text x="450" y="38"
                text-anchor="middle"
                font-family="Georgia,serif"
                font-size="19"
                font-weight="bold"
                fill="#4f3a14">
            COSMOVISIÓN · REPRESENTACIÓN SIMBÓLICA
          </text>

          <rect x="80" y="65" width="740" height="90" rx="8"
                fill="${activo("cielo_superior") ? "#d3a23d" : "#e4d3a6"}"
                stroke="#74561c" stroke-width="${activo("cielo_superior") ? 4 : 2}"/>

          <text x="450" y="115"
                text-anchor="middle"
                font-family="Georgia,serif"
                font-size="23"
                fill="#173b2d">
            Cielo superior / dualidad
          </text>

          <rect x="80" y="170" width="740" height="90" rx="8"
                fill="${activo("cielo") ? "#d3a23d" : "#e4d3a6"}"
                stroke="#74561c" stroke-width="${activo("cielo") ? 4 : 2}"/>

          <text x="450" y="220"
                text-anchor="middle"
                font-family="Georgia,serif"
                font-size="23"
                fill="#173b2d">
            Cielo / lluvia / estrellas
          </text>

          <rect x="80" y="275" width="740" height="90" rx="8"
                fill="${activo("lugar_primordial") ? "#d3a23d" : "#e4d3a6"}"
                stroke="#74561c" stroke-width="${activo("lugar_primordial") ? 4 : 2}"/>

          <text x="450" y="325"
                text-anchor="middle"
                font-family="Georgia,serif"
                font-size="23"
                fill="#173b2d">
            Mundo terrestre / lugar primordial
          </text>

          <rect x="80" y="380" width="740" height="90" rx="8"
                fill="${activo("inframundo") ? "#7f3327" : "#d7c392"}"
                stroke="#624818" stroke-width="${activo("inframundo") ? 4 : 2}"/>

          <text x="450" y="430"
                text-anchor="middle"
                font-family="Georgia,serif"
                font-size="23"
                fill="${activo("inframundo") ? "#fae4a2" : "#173b2d"}">
            Inframundo / mundo de los muertos
          </text>

          <circle cx="450" cy="${y}" r="12"
                  fill="#9d2d1e"
                  stroke="#f4d979"
                  stroke-width="4"/>
        </svg>
      </div>
    `;
  }

  function renderReferenciaVisual(carta,mapa){
    const contenedor=document.getElementById("mapa-contenedor");
    contenedor.innerHTML="";

    if(!mapa) return;

    const puntos=(mapa.puntos || []);
    const chips=puntos.length
      ? `<div class="mapa-chips">${
          puntos.map(pt=>`<span class="mapa-chip">${escaparHTML(pt.nombre)}</span>`).join("")
        }</div>`
      : "";

    const grafico=mapa.tipo==="cosmologico"
      ? mapaCosmologico(mapa)
      : mapaMexico(mapa);

    const rutaImagen=`${carta.codigo}.jpg`;

    const articulo=document.createElement("article");
    articulo.className="panel mapa-panel";

    articulo.innerHTML=`
      <div class="mapa-interior">

        <div class="mapa-cabecera">
          <h2 id="visual-titulo">
            🗺️ ${escaparHTML(mapa.titulo)}
            <span class="visual-etiqueta" id="visual-etiqueta">MAPA</span>
          </h2>
          <p id="visual-descripcion">${escaparHTML(mapa.descripcion || "")}</p>
        </div>

        <div class="visual-carrusel">

          <div class="visual-vista activa" id="vista-mapa">
            ${grafico}
          </div>

          <div class="visual-vista" id="vista-real">
            <img
              class="visual-imagen-real"
              id="imagen-real-referencia"
              src="${escaparHTML(rutaImagen)}"
              alt="Imagen real de ${escaparHTML(carta.nombre)}"
              loading="lazy">
          </div>

          <button
            class="visual-flecha izq"
            id="visual-prev"
            type="button"
            aria-label="Ver mapa"
            style="display:none">
            ‹
          </button>

          <button
            class="visual-flecha der"
            id="visual-next"
            type="button"
            aria-label="Ver imagen real"
            style="display:none">
            ›
          </button>

        </div>

        <div class="visual-indicadores" id="visual-indicadores" style="display:none">
          <span class="visual-punto activo" id="punto-mapa"></span>
          <span class="visual-punto" id="punto-real"></span>
        </div>

        <div class="mapa-leyenda" id="visual-leyenda">
          ${chips}
          <p class="mapa-nota">${escaparHTML(mapa.nota || "")}</p>
        </div>

      </div>
    `;

    contenedor.appendChild(articulo);

    const img=articulo.querySelector("#imagen-real-referencia");
    const vistaMapa=articulo.querySelector("#vista-mapa");
    const vistaReal=articulo.querySelector("#vista-real");
    const prev=articulo.querySelector("#visual-prev");
    const next=articulo.querySelector("#visual-next");
    const indicadores=articulo.querySelector("#visual-indicadores");
    const puntoMapa=articulo.querySelector("#punto-mapa");
    const puntoReal=articulo.querySelector("#punto-real");
    const titulo=articulo.querySelector("#visual-titulo");
    const descripcion=articulo.querySelector("#visual-descripcion");
    const etiqueta=articulo.querySelector("#visual-etiqueta");
    const leyenda=articulo.querySelector("#visual-leyenda");

    let actual="mapa";

    function mostrar(tipo){
      actual=tipo;

      const esMapa=tipo==="mapa";

      vistaMapa.classList.toggle("activa",esMapa);
      vistaReal.classList.toggle("activa",!esMapa);

      puntoMapa.classList.toggle("activo",esMapa);
      puntoReal.classList.toggle("activo",!esMapa);

      titulo.childNodes[0].nodeValue = esMapa
        ? `🗺️ ${mapa.titulo} `
        : `🖼️ Imagen real de referencia `;

      etiqueta.textContent=esMapa ? "MAPA" : "REAL";

      descripcion.textContent=esMapa
        ? (mapa.descripcion || "")
        : `Referencia visual real relacionada con ${carta.nombre}.`;

      leyenda.style.display=esMapa ? "block" : "none";

      prev.style.display=esMapa ? "none" : "grid";
      next.style.display=esMapa ? "grid" : "none";
    }

    function activarImagenReal(){
      indicadores.style.display="flex";
      next.style.display="grid";
      mostrar("mapa");
    }

    function quitarImagenReal(){
      if(vistaReal) vistaReal.remove();
      if(prev) prev.remove();
      if(next) next.remove();
      if(indicadores) indicadores.remove();
    }

    img.addEventListener("load", activarImagenReal);
    img.addEventListener("error", quitarImagenReal);

    /*
      IMPORTANTE:
      Si el JPG ya estaba en caché, puede terminar de cargar
      antes de que el evento "load" quede registrado.
      Por eso también comprobamos inmediatamente si ya está listo.
    */
    if(img.complete){
      if(img.naturalWidth > 0){
        activarImagenReal();
      }else{
        quitarImagenReal();
      }
    }

    next.addEventListener("click",()=>mostrar("real"));
    prev.addEventListener("click",()=>mostrar("mapa"));
  }

  /* ======================================================
     RENDER CULTURAL
     ====================================================== */

  function renderCultural(carta){
    const contenedor=document.getElementById("secciones-culturales");
    contenedor.innerHTML="";

    const culturales=[];
    const juegoExtra=[];

    (carta.secciones || []).forEach(seccion=>{
      const titulo=(seccion.titulo || "").toLowerCase();

      if(
        titulo.includes("temalácatl") ||
        titulo.includes("ficción") ||
        titulo.includes("ficticio") ||
        titulo.includes("representación") ||
        titulo.includes("interpretación")
      ){
        juegoExtra.push(seccion);
      }else{
        culturales.push(seccion);
      }
    });

    culturales.forEach(seccion=>{
      const articulo=document.createElement("article");
      articulo.className="panel panel-cultural";

      articulo.innerHTML=`
        <div class="panel-cultural-interior">
          <div class="titulo-panel">
            <span class="icono">${escaparHTML(seccion.icono || "🏺")}</span>
            <span>${escaparHTML(seccion.titulo)}</span>
          </div>

          <p class="texto-cultural">${escaparHTML(seccion.contenido)}</p>
        </div>
      `;

      contenedor.appendChild(articulo);
    });

    return juegoExtra;
  }


  function renderFuentes(carta){
    const contenedor=document.getElementById("contenedor-fuentes");
    contenedor.innerHTML="";

    if(!carta.fuentes || !carta.fuentes.length){
      contenedor.innerHTML="<p>Fuentes pendientes de integración.</p>";
      return;
    }

    const ul=document.createElement("ul");

    carta.fuentes.forEach(fuente=>{
      const li=document.createElement("li");
      const institucion=escaparHTML(fuente.institucion || "");
      const titulo=escaparHTML(fuente.titulo || "");
      const url=fuente.url || "";

      li.innerHTML=`
        <strong>${institucion}</strong>
        ${titulo ? " — " + titulo : ""}
        ${url
          ? `<br><a href="${escaparHTML(url)}"
                   target="_blank"
                   rel="noopener noreferrer">
               Consultar fuente
             </a>`
          : ""}
      `;

      ul.appendChild(li);
    });

    contenedor.appendChild(ul);
  }

  /* ======================================================
     RENDER TEMALÁCATL
     ====================================================== */

  function renderTemalacatl(carta,juegoExtra){
    const t=carta.temalacatl || {};

    const generales=document.getElementById("datos-generales");
    generales.innerHTML="";

    (carta.datos_generales || []).forEach(dato=>{
      const bloque=document.createElement("div");
      bloque.className="placa-dato";
      bloque.innerHTML=`
        <strong>${escaparHTML(dato.nombre)}</strong>
        <span>${escaparHTML(dato.valor)}</span>
      `;
      generales.appendChild(bloque);
    });

    /*
      Tipo / terreno como placa adicional.
      Así no duplicamos ATK/DEF aquí porque tienen sus propios medallones.
    */
    document.getElementById("tipo-juego").innerHTML=`
      <div class="bloque-juego">
        <h3>◆ Afinidad de la carta</h3>
        <p>
          <strong>Categoría:</strong> ${escaparHTML(t.categoria || "—")}
          &nbsp;·&nbsp;
          <strong>Terreno:</strong> ${escaparHTML(t.terreno || t.tipo || "—")}
        </p>
      </div>
    `;

    document.getElementById("rareza-juego").textContent=
      t.rareza || "Sin rareza";

    document.getElementById("atk-juego").textContent=
      (t.atk === null || t.atk === undefined) ? "—" : t.atk;

    document.getElementById("def-juego").textContent=
      (t.def === null || t.def === undefined) ? "—" : t.def;

    document.getElementById("descripcion-juego").innerHTML=
      t.descripcion
        ? `<div class="bloque-juego">
             <h3>📜 Descripción de la carta</h3>
             <p>${escaparHTML(t.descripcion)}</p>
           </div>`
        : "";

    document.getElementById("efecto-juego").innerHTML=
      t.efecto
        ? `<div class="bloque-juego efecto-destacado">
             <h3>✦ EFECTO / HABILIDAD</h3>
             <p>${escaparHTML(t.efecto)}</p>
           </div>`
        : "";

    const extra=document.getElementById("interpretacion-juego");
    extra.innerHTML="";

    juegoExtra.forEach(seccion=>{
      const bloque=document.createElement("div");
      bloque.className="bloque-juego";
      bloque.innerHTML=`
        <h3>${escaparHTML(seccion.icono || "🎴")} ${escaparHTML(seccion.titulo)}</h3>
        <p>${escaparHTML(seccion.contenido)}</p>
      `;
      extra.appendChild(bloque);
    });
  }

  /* ======================================================
     VIDEO
     ====================================================== */

  function renderVideo(carta){
    const media=document.getElementById("media-container");
    const controles=document.getElementById("controles-sonido");
    const ruta=carta.multimedia?.video;

    if(!ruta){
      controles.style.display="none";
      media.innerHTML=`
        <div class="video-proximamente">
          <div class="simbolo">🎬</div>
          <strong>VIDEO PRÓXIMAMENTE</strong>
        </div>
      `;
      return;
    }

    media.innerHTML=`
      <video
        id="video-principal"
        class="video-principal"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        controls>
        <source src="${escaparHTML(ruta)}" type="video/mp4">
        Tu navegador no puede reproducir este video.
      </video>
    `;

    controles.style.display="flex";

    const video=document.getElementById("video-principal");
    const boton=document.getElementById("boton-sonido");

    video.muted=true;

    const intento=video.play();
    if(intento !== undefined) intento.catch(()=>{});

    boton.textContent="🔊 Activar sonido";

    boton.onclick=()=>{
      if(video.muted){
        video.muted=false;
        video.volume=1;
        video.play();
        boton.textContent="🔊 Sonido activado";
      }else{
        video.muted=true;
        boton.textContent="🔇 Activar sonido";
      }
    };
  }

  /* ======================================================
     CARGA PRINCIPAL
     ====================================================== */

  async function cargarCarta(){
    try{
      const id=new URLSearchParams(window.location.search).get("id");

      if(!id){
        document.getElementById("pagina").innerHTML=`
          <div class="error">
            <div>
              <h1>TEMALÁCATL CÓDICE</h1>
              <p>Escanea el código QR de una carta para abrir su registro.</p>
            </div>
          </div>
        `;
        return;
      }

      const [respuestaCards,respuestaMaps]=await Promise.all([
        fetch("cards.json?v="+Date.now()),
        fetch("maps.json?v="+Date.now()).catch(()=>null)
      ]);

      if(!respuestaCards.ok){
        throw new Error("No se pudo cargar cards.json");
      }

      const base=await respuestaCards.json();

      let mapas={};
      if(respuestaMaps && respuestaMaps.ok){
        mapas=await respuestaMaps.json();
      }

      const carta=base[id];

      if(!carta){
        document.getElementById("pagina").innerHTML=`
          <div class="error">
            <div>
              <h1>CARTA NO ENCONTRADA</h1>
              <p>No existe una carta registrada con el código <strong>${escaparHTML(id)}</strong>.</p>
            </div>
          </div>
        `;
        return;
      }

      document.title=carta.nombre+" | Temalácatl Códice";

      document.getElementById("codigo").textContent=
        `TEMALÁCATL CÓDICE · ${carta.codigo}`;

      document.getElementById("nombre").textContent=
        carta.nombre;

      const subtitulo=document.getElementById("subtitulo");

      if(carta.subtitulo){
        subtitulo.textContent=carta.subtitulo;
        subtitulo.style.display="block";
      }else{
        subtitulo.style.display="none";
      }

      renderVideo(carta);

      const juegoExtra=renderCultural(carta);
      renderReferenciaVisual(carta,mapas[id] || carta.mapa || null);
      renderFuentes(carta);
      renderTemalacatl(carta,juegoExtra);

    }catch(error){
      console.error(error);

      document.getElementById("pagina").innerHTML=`
        <div class="error">
          <div>
            <h1>ERROR AL CARGAR EL CÓDICE</h1>
            <p>No fue posible cargar la información de esta carta.</p>
          </div>
        </div>
      `;
    }
  }

  cargarCarta();
</script>

</body>
</html>
