<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Temalácatl Códice</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07140f;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      background: #eee5d2;
      min-height: 100vh;
    }

    .encabezado {
      background: #06291d;
      color: white;
      text-align: center;
      padding: 28px 20px 30px;
      border-bottom: 4px solid #c99b37;
    }

    .codigo {
      color: #d8ad4d;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .encabezado h1 {
      margin: 10px 0 4px;
      font-family: Georgia, serif;
      font-size: 38px;
      color: #f4e5bd;
    }

    .subtitulo {
      margin: 0;
      font-size: 19px;
      font-style: italic;
      color: #d8ad4d;
    }

    /* VIDEO */

    .hero {
      width: 100%;
      background: #020806;
      border-bottom: 4px solid #c99b37;
    }

    .video-principal {
      display: block;
      width: 100%;
      height: auto;
      background: black;
    }

    .video-proximamente {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #061c13;
      color: #f4e5bd;
      text-align: center;
      padding: 30px;
    }

    .video-proximamente span {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .controles-sonido {
      background: #0b2e20;
      text-align: center;
      padding: 12px;
    }

    .boton-sonido {
      border: 1px solid #d6aa4b;
      background: #123c2b;
      color: #f4e5bd;
      padding: 11px 22px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .boton-sonido:hover {
      background: #19543b;
    }

    /* CONTENIDO */

    .contenido {
      padding: 18px;
    }

    .tarjeta {
      background: #fffaf0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 5px solid #b88b32;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }

    .tarjeta h2 {
      margin-top: 0;
      color: #123c2b;
      font-size: 21px;
    }

    .tarjeta h3 {
      color: #123c2b;
      margin-bottom: 7px;
    }

    .tarjeta p {
      line-height: 1.65;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .dato {
      background: #f2e7ce;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .dato strong {
      display: block;
      color: #123c2b;
      margin-bottom: 5px;
    }

    /* TEMALACATL */

    .temalacatl {
      background: #0b2e20;
      color: white;
      border-left: 5px solid #d6aa4b;
    }

    .temalacatl h2,
    .temalacatl h3 {
      color: #f3d993;
    }

    .temalacatl .dato {
      background: #f4ead4;
      color: #222;
    }

    .efecto {
      margin-top: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(214,170,75,0.5);
      padding: 17px;
      border-radius: 12px;
    }

    .efecto strong {
      color: #f3d993;
    }

    /* FUENTES */

    .fuentes ul {
      padding-left: 20px;
    }

    .fuentes li {
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .fuentes a {
      color: #0b5c42;
      font-weight: bold;
    }

    .sin-fuentes {
      color: #665d4d;
      font-style: italic;
    }

    /* ERROR */

    .error {
      padding: 50px 20px;
      text-align: center;
      color: white;
    }

    footer {
      background: #061c13;
      color: #d8ad4d;
      text-align: center;
      padding: 25px 15px;
      border-top: 3px solid #c99b37;
    }

    footer strong {
      font-family: Georgia, serif;
      font-size: 22px;
    }

    footer p {
      margin-bottom: 0;
    }

    @media (max-width: 500px) {

      .encabezado h1 {
        font-size: 31px;
      }

      .contenido {
        padding: 12px;
      }

      .tarjeta {
        padding: 17px;
      }

      .datos {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>

</head>


<body>

<main class="contenedor" id="pagina">


  <!-- ENCABEZADO -->

  <header class="encabezado">

    <div
      class="codigo"
      id="codigo">
    </div>

    <h1 id="nombre">
      Cargando...
    </h1>

    <p
      class="subtitulo"
      id="subtitulo">
    </p>

  </header>


  <!-- VIDEO -->

  <section class="hero">

    <div id="media-container">
    </div>

    <div
      class="controles-sonido"
      id="controles-sonido"
      style="display:none;">

      <button
        class="boton-sonido"
        id="boton-sonido">

        🔊 Activar sonido

      </button>

    </div>

  </section>


  <!-- CONTENIDO -->

  <section class="contenido">


    <!-- CÓDICE CULTURAL -->

    <div id="secciones">
    </div>


    <!-- DATOS GENERALES -->

    <article class="tarjeta">

      <h2>
        📌 Datos generales
      </h2>

      <div
        class="datos"
        id="datos-generales">
      </div>

    </article>


    <!-- DATOS DEL JUEGO -->

    <article class="tarjeta temalacatl">

      <h2>
        ⚔️ En Temalácatl
      </h2>

      <div
        class="datos"
        id="datos-temalacatl">
      </div>


      <div
        id="descripcion-juego">
      </div>


      <div
        id="efecto-juego">
      </div>

    </article>


    <!-- FUENTES -->

    <article class="tarjeta fuentes">

      <h2>
        📚 Fuentes
      </h2>

      <div id="contenedor-fuentes">
      </div>

    </article>


  </section>


  <footer>

    <strong>
      Temalácatl Códice
    </strong>

    <p>
      Conoce México a través de sus cartas
    </p>

  </footer>


</main>


<script>

async function cargarCarta() {

  try {

    /*
    LEER ID DE LA URL

    Ejemplo:
    ?id=ENM-082
    */

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const id =
      parametros.get("id");


    if (!id) {

      document.getElementById(
        "pagina"
      ).innerHTML = `

        <div class="error">

          <h1>
            Temalácatl Códice
          </h1>

          <p>
            Escanea el código QR de una carta
            para consultar su información.
          </p>

        </div>

      `;

      return;
    }


    /*
    CARGAR BASE DE DATOS
    */

    const respuesta =
      await fetch(
        "cards.json?v=" + Date.now()
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudo cargar cards.json"
      );

    }


    const baseDatos =
      await respuesta.json();


    /*
    BUSCAR CARTA
    */

    const carta =
      baseDatos[id];


    if (!carta) {

      document.getElementById(
        "pagina"
      ).innerHTML = `

        <div class="error">

          <h1>
            Carta no encontrada
          </h1>

          <p>
            No existe una carta registrada con el código
            <strong>${id}</strong>.
          </p>

        </div>

      `;

      return;
    }


    /*
    TÍTULO
    */

    document.title =
      carta.nombre +
      " | Temalácatl Códice";


    /*
    ENCABEZADO
    */

    document.getElementById(
      "codigo"
    ).textContent =
      `TEMALÁCATL CÓDICE · ${carta.codigo}`;


    document.getElementById(
      "nombre"
    ).textContent =
      carta.nombre;


    const subtitulo =
      document.getElementById(
        "subtitulo"
      );


    if (carta.subtitulo) {

      subtitulo.textContent =
        carta.subtitulo;

      subtitulo.style.display =
        "block";

    } else {

      subtitulo.style.display =
        "none";

    }


    /*
    ======================================
    VIDEO
    ======================================
    */


    const mediaContainer =
      document.getElementById(
        "media-container"
      );


    const controlesSonido =
      document.getElementById(
        "controles-sonido"
      );


    const rutaVideo =
      carta.multimedia?.video;


    if (rutaVideo) {

      mediaContainer.innerHTML = `

        <video
          id="video-principal"
          class="video-principal"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          controls>

          <source
            src="${rutaVideo}"
            type="video/mp4">

          Tu navegador no puede reproducir
          este video.

        </video>

      `;


      controlesSonido.style.display =
        "block";


      const video =
        document.getElementById(
          "video-principal"
        );


      /*
      Intentar reproducción automática.
      */

      video.muted = true;


      function reproducir() {

        const intento =
          video.play();

        if (
          intento !== undefined
        ) {

          intento.catch(
            error => {

              console.log(
                "Esperando interacción para reproducir."
              );

            }
          );

        }

      }


      video.addEventListener(
        "loadeddata",
        reproducir
      );


      video.addEventListener(
        "canplay",
        reproducir
      );


      reproducir();


      /*
      ACTIVAR SONIDO
      */

      const botonSonido =
        document.getElementById(
          "boton-sonido"
        );


      botonSonido.onclick =
        function() {

          video.muted =
            false;

          video.volume =
            1;

          video.play();

          botonSonido.textContent =
            "🔊 Sonido activado";

        };


    } else {

      controlesSonido.style.display =
        "none";


      mediaContainer.innerHTML = `

        <div class="video-proximamente">

          <span>
            🎬
          </span>

          <strong>
            Video próximamente
          </strong>

        </div>

      `;

    }


    /*
    ======================================
    CÓDICE CULTURAL
    ======================================
    */


    const contenedorSecciones =
      document.getElementById(
        "secciones"
      );


    contenedorSecciones.innerHTML =
      "";


    if (
      carta.secciones &&
      carta.secciones.length > 0
    ) {


      carta.secciones.forEach(
        seccion => {

          const bloque =
            document.createElement(
              "article"
            );


          bloque.className =
            "tarjeta";


          bloque.innerHTML = `

            <h2>

              ${seccion.icono || "📜"}

              ${seccion.titulo}

            </h2>


            <p>

              ${seccion.contenido}

            </p>

          `;


          contenedorSecciones.appendChild(
            bloque
          );

        }
      );

    }


    /*
    ======================================
    DATOS GENERALES
    ======================================
    */


    const datosGenerales =
      document.getElementById(
        "datos-generales"
      );


    datosGenerales.innerHTML =
      "";


    if (
      carta.datos_generales
    ) {


      carta.datos_generales.forEach(
        dato => {

          const bloque =
            document.createElement(
              "div"
            );


          bloque.className =
            "dato";


          bloque.innerHTML = `

            <strong>
              ${dato.nombre}
            </strong>

            ${dato.valor}

          `;


          datosGenerales.appendChild(
            bloque
          );

        }
      );

    }


    /*
    ======================================
    INFORMACIÓN DEL JUEGO
    ======================================
    */


    const t =
      carta.temalacatl || {};


    const atk =
      t.atk === null ||
      t.atk === undefined
      ? "—"
      : t.atk;


    const def =
      t.def === null ||
      t.def === undefined
      ? "—"
      : t.def;


    document.getElementById(
      "datos-temalacatl"
    ).innerHTML = `


      <div class="dato">

        <strong>
          Categoría
        </strong>

        ${t.categoria || "—"}

      </div>


      <div class="dato">

        <strong>
          Terreno
        </strong>

        ${t.terreno || t.tipo || "—"}

      </div>


      <div class="dato">

        <strong>
          Rareza
        </strong>

        ${t.rareza || "—"}

      </div>


      <div class="dato">

        <strong>
          ATK
        </strong>

        ${atk}

      </div>


      <div class="dato">

        <strong>
          DEF
        </strong>

        ${def}

      </div>

    `;


    /*
    DESCRIPCIÓN DEL JUEGO
    */


    const descripcionJuego =
      document.getElementById(
        "descripcion-juego"
      );


    if (t.descripcion) {

      descripcionJuego.innerHTML = `

        <div class="efecto">

          <h3>
            📜 Descripción de la carta
          </h3>

          <p>
            ${t.descripcion}
          </p>

        </div>

      `;

    } else {

      descripcionJuego.innerHTML =
        "";

    }


    /*
    EFECTO / HABILIDAD
    */


    const efectoJuego =
      document.getElementById(
        "efecto-juego"
      );


    if (t.efecto) {

      efectoJuego.innerHTML = `

        <div class="efecto">

          <h3>
            ✨ Efecto / Habilidad
          </h3>

          <p>
            ${t.efecto}
          </p>

        </div>

      `;

    } else {

      efectoJuego.innerHTML =
        "";

    }


    /*
    ======================================
    FUENTES
    ======================================
    */


    const contenedorFuentes =
      document.getElementById(
        "contenedor-fuentes"
      );


    if (
      carta.fuentes &&
      carta.fuentes.length > 0
    ) {


      const lista =
        document.createElement(
          "ul"
        );


      carta.fuentes.forEach(
        fuente => {


          const elemento =
            document.createElement(
              "li"
            );


          let contenido = `

            <strong>
              ${fuente.institucion || ""}
            </strong>

          `;


          if (
            fuente.titulo
          ) {

            contenido += `

              — ${fuente.titulo}

            `;

          }


          if (
            fuente.url
          ) {

            contenido += `

              <br>

              <a
                href="${fuente.url}"
                target="_blank"
                rel="noopener noreferrer">

                Consultar fuente

              </a>

            `;

          }


          elemento.innerHTML =
            contenido;


          lista.appendChild(
            elemento
          );

      });


      contenedorFuentes.innerHTML =
        "";


      contenedorFuentes.appendChild(
        lista
      );


    } else {


      contenedorFuentes.innerHTML = `

        <p class="sin-fuentes">

          Las fuentes culturales de esta carta
          están pendientes de integración.

        </p>

      `;

    }


  } catch (error) {


    console.error(
      error
    );


    document.getElementById(
      "pagina"
    ).innerHTML = `

      <div class="error">

        <h1>
          Error al cargar el Códice
        </h1>

        <p>
          No fue posible cargar
          la información de esta carta.
        </p>

      </div>

    `;

  }

}


cargarCarta();

</script>


</body>
</html>
